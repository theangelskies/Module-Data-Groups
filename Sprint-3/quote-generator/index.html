<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote generator app</title>
    <script defer src="quotes.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="quote-card">
      <p id="quote">Strive not to be a success, but rather to be of value.</p>
      <p id="author">Albert Einstein</p>
      <button id="new-quote">New quote</button>
      <div id="auto-play">
        <label>
          <input type="checkbox" id="auto-play-toggle" />
          Auto-play
        </label>
        <span id="auto-status">auto-play:OFF</span>
      </div>
    </main>
  </body>
</html>
